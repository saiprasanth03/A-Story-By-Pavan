    <div id="error-overlay" style="display:none; position:fixed; z-index:999999; background:red; color:white; padding:20px; inset:0; font-family:monospace; white-space:pre-wrap;"></div>
    <script>
      window.addEventListener('error', (event) => {
        const el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.textContent += event.message + '\n' + event.filename + ':' + event.lineno + ':' + event.colno + '\n' + (event.error && event.error.stack ? event.error.stack : '') + '\n\n';
      });
      window.addEventListener('unhandledrejection', (event) => {
        const el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.textContent += 'Unhandled Rejection: ' + event.reason + '\n\n';
      });
    </script>

    <script>
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        const registerSW = () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
            .catch((err) => console.error('PWA Service Worker registration failed:', err));
        };
        if (document.readyState === 'complete') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
